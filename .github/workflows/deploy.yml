name: Build & Deploy to GCP VPS via Docker

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3. Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-app:latest

      - name: 4. Deploy to GCP VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Login Docker di VPS
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Pull Image Terbaru dari Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/my-app:latest
            
            # Stop & Remove Container Lama jika ada
            docker stop my-app-container || true
            docker rm my-app-container || true
            
            # Run Container Baru di Port 80 VPS
            docker run -d \
              --name my-app-container \
              --restart always \
              -p 80:3000 \
              ${{ secrets.DOCKER_USERNAME }}/my-app:latest
