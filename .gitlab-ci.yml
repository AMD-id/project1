stages:
  - build
  - push-staging
  - deploy-staging
  - push-production
  - deploy-production

variables:
  DOCKERHUB_USER: "username_dockerhub_anda"
  DOCKER_IMAGE_NAME: "$DOCKERHUB_USER/my-app"
  DEPLOY_SERVER_IP: "34.124.247.162"      # IP Server 2 Target Deploy
  DEPLOY_SERVER_USER: "gitlab-runner"            # User SSH Server 2

# Autentikasi otomatis ke Docker Hub di setiap job
before_script:
  - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin

# -------------------------------------------------------------------
# STAGING STAGE (Otomatis)
# -------------------------------------------------------------------

build_test:
  stage: build
  script:
    - docker build -t $DOCKER_IMAGE_NAME:test .
  after_script:
    - docker rmi $DOCKER_IMAGE_NAME:test || true

push_staging:
  stage: push-staging
  script:
    - docker build -t $DOCKER_IMAGE_NAME:staging-$CI_COMMIT_SHORT_SHA .
    - docker push $DOCKER_IMAGE_NAME:staging-$CI_COMMIT_SHORT_SHA
  after_script:
    - docker rmi $DOCKER_IMAGE_NAME:staging-$CI_COMMIT_SHORT_SHA || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'

deploy_staging:
  stage: deploy-staging
  script:
    - |
      ssh -o StrictHostKeyChecking=no $DEPLOY_SERVER_USER@$DEPLOY_SERVER_IP "
        docker pull $DOCKER_IMAGE_NAME:staging-$CI_COMMIT_SHORT_SHA && \
        (docker stop my-app-staging || true) && \
        (docker rm my-app-staging || true) && \
        docker run -d --name my-app-staging --restart always -p 8080:3000 $DOCKER_IMAGE_NAME:staging-$CI_COMMIT_SHORT_SHA && \
        docker image prune -af
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'

# -------------------------------------------------------------------
# PRODUCTION STAGE (Manual Trigger)
# -------------------------------------------------------------------

push_production:
  stage: push-production
  script:
    - docker build -t $DOCKER_IMAGE_NAME:latest .
    - docker push $DOCKER_IMAGE_NAME:latest
  after_script:
    - docker rmi $DOCKER_IMAGE_NAME:latest || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: manual

deploy_production:
  stage: deploy-production
  script:
    - |
      ssh -o StrictHostKeyChecking=no $DEPLOY_SERVER_USER@$DEPLOY_SERVER_IP "
        docker pull $DOCKER_IMAGE_NAME:latest && \
        (docker stop my-app-production || true) && \
        (docker rm my-app-production || true) && \
        docker run -d --name my-app-production --restart always -p 80:3000 $DOCKER_IMAGE_NAME:latest && \
        docker image prune -af
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: manual
